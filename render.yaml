services:
  - type: web
    name: covermint-lc
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        sync: false # pooled session URL (port 5432, pooler.supabase.com)
      - key: DIRECT_URL
        sync: false # direct URL (kept for reference/future use)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render generates a fresh prod secret
      - key: OTP_MODE
        value: dev
      - key: TOS_VERSION
        value: v1
      - key: STORAGE_BUCKET
        value: lg-docs
